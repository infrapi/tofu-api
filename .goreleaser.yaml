version: 2

project_name: tofu-api

builds:
  - id: tofu-api
    binary: tofu-api
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - examples/**/*
      - packaging/tofu-api@.service
      - packaging/example.env
      - packaging/example.secrets

nfpms:
  - id: default
    package_name: tofu-api
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: InfraPI
    homepage: https://github.com/infrapi/tofu-api
    maintainer: InfraPI <https://github.com/infrapi>
    description: REST API over an OpenTofu-protocol provider, an instance per provider.
    license: MIT
    formats: [rpm, deb]
    bindir: /usr/bin
    contents:
      - src: packaging/tofu-api@.service
        dst: /usr/lib/systemd/system/tofu-api@.service
        file_info:
          mode: 0644
      # A provider's files: <provider>.yaml, .env, .secrets; none is shipped.
      - dst: /etc/tofu-api
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: tofu-api
      - src: README.md
        dst: /usr/share/doc/tofu-api/README.md
        type: doc
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/tofu-api/LICENSE
        type: doc
        file_info:
          mode: 0644
      - src: packaging/example.env
        dst: /usr/share/doc/tofu-api/examples/example.env
        type: doc
        file_info:
          mode: 0644
      - src: packaging/example.secrets
        dst: /usr/share/doc/tofu-api/examples/example.secrets
        type: doc
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/preinstall.sh
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
    rpm:
      group: System Environment/Daemons

checksum:
  name_template: checksums.txt

# The container image, multi-platform, on every release: the binary above
# in the Dockerfile at the repository root. Tags: the version (0.5.0), its
# minor (0.5) and latest, the last two only for a release that is not a
# pre-release. The CI logs in to ghcr.io first.
dockers_v2:
  - id: tofu-api
    ids: [tofu-api]
    dockerfile: Dockerfile
    images:
      - ghcr.io/infrapi/tofu-api
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: tofu-api
      org.opencontainers.image.description: tofu-api, an InfraPI API over an OpenTofu-protocol provider
      org.opencontainers.image.source: https://github.com/infrapi/tofu-api
      org.opencontainers.image.url: https://github.com/infrapi/tofu-api
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release itself, and its notes, are go-semantic-release's: this adds the
# files to it.
release:
  github:
    owner: infrapi
    name: tofu-api
  mode: keep-existing

changelog:
  disable: true
