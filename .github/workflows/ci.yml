# tofu-api's CI.
# infrapi/ci's Go workflow: the checks on a push or a pull request; on a push
# to main, go-semantic-release makes the version and the GitHub release from
# the conventional commits, then GoReleaser adds the archives, the rpm and deb
# packages, and pushes the image ghcr.io/infrapi/tofu-api; the portal
# (infrapi/docs) and the org profile (infrapi/.github) are told after a
# release, a change to docs/ or a manual run. Its inputs:
# https://github.com/infrapi/ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    uses: infrapi/ci/.github/workflows/go.yml@v1
    permissions:
      contents: write   # the tag and the release
      packages: write   # the image, on ghcr.io
    with:
      binary: tofu-api
      main: .
      release: semantic
      docker: true
      notify-docs: true
    secrets: inherit
